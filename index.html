<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOSMIK UNDERTALE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Фон космоса -->
    <canvas id="space-canvas"></canvas>

    <!-- Плеер для звука (Название твоего файла) -->
    <audio id="bg-music" loop>
        <source src="horror (online-audio-converter.com).mp3" type="audio/mpeg">
    </audio>

    <!-- Кнопка звука -->
    <button id="music-toggle" onclick="toggleMusic()">🔇 Включить звук</button>

    <!-- Главное меню -->
    <div class="menu-wrapper" id="main-menu">
        <div class="game-title">KOSMIK<br>UNDERTALE</div>
        <div class="menu-buttons">
            <button class="menu-btn" onclick="action('continue')">Продолжить игру</button>
            <button class="menu-btn" onclick="action('new_game')">Начать новую</button>
            <button class="menu-btn" onclick="action('settings')">Настройки</button>
        </div>
    </div>

    <!-- Экран игры -->
    <div id="game-screen">
        <!-- 1. Диалог -->
        <div id="scene-awake" class="scene">
            <div class="text-box">
                <p id="dialogue-text">Вы медленно открываете глаза...</p>
                <button id="next-btn" onclick="nextDialogue()">Далее ▶</button>
            </div>
        </div>

        <!-- 2. Титры -->
        <div id="splash-screen" style="display: none;">
            <h1>Maksimozo<br>представляет</h1>
        </div>

        <!-- 3. Комната -->
        <div id="map-container" style="display: none;">
            <div id="ship-window">
                <div id="space-view">
                    <div class="debris debris-1"></div>
                    <div class="debris debris-2"></div>
                    <div id="turbine"></div>
                </div>
            </div>
            <div id="map"></div>
            <div id="player">👨‍🚀</div> 
            <div id="rat">🐀</div>
        </div>

        <!-- 4. Кнопки управления -->
        <div id="controls" style="display: none;">
            <button class="control-btn up" onclick="move('up')">▲</button>
            <button class="control-btn left" onclick="move('left')">◀</button>
            <button class="control-btn right" onclick="move('right')">▶</button>
            <button class="control-btn down" onclick="move('down')">▼</button>
        </div>
    </div>

    <script src="menu.js"></script>
</body>
</html>
