<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOSMIK UNDERTALE</title>
    <!-- Подключаем стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Фон космоса -->
    <canvas id="space-canvas"></canvas>

    <!-- Плеер для звука -->
<audio id="bg-music" loop>
    <source src="horror (online-audio-converter.com).mp3" type="audio/mpeg">
</audio><!-- Главное меню -->
    <div class="menu-wrapper" id="main-menu">
        <div class="game-title">KOSMIK<br>UNDERTALE</div>

        <div class="menu-buttons">
            <button class="menu-btn" onclick="action('continue')">Продолжить игру</button>
            <button class="menu-btn" onclick="action('new_game')">Начать новую</button>
            <button class="menu-btn" onclick="action('settings')">Настройки</button>
        </div>
    </div>

    <!-- Экран игры (пока пустой) -->
    <div id="game-screen">
        <!-- Сюда мы потом вставим твою игру -->
        <div id="scene-awake" class="scene">
    <div class="text-box">
        <p id="dialogue-text">Вы медленно открываете глаза. Всё тело ломит от боли. Вокруг темно, слышен только скрип металла и тихое шипение воздуха...</p>
        <button id="next-btn" onclick="nextDialogue()">Далее ▶</button>
    </div>
        </div>
    </div>

    <!-- Подключаем скрипты -->
    <script src="menu.js"></script>
</body>
</html>
