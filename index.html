<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOSMIK UNDERTALE</title>
    <!-- Подключаем стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Фон космоса -->
    <canvas id="space-canvas"></canvas>

    <!-- Плеер для звука -->
<audio id="bg-music" loop>
    <source src="horror (online-audio-converter.com).mp3" type="audio/mpeg">
</audio><!-- Главное меню -->
    <div class="menu-wrapper" id="main-menu">
        <div class="game-title">KOSMIK<br>UNDERTALE</div>

        <div class="menu-buttons">
            <button class="menu-btn" onclick="action('continue')">Продолжить игру</button>
            <button class="menu-btn" onclick="action('new_game')">Начать новую</button>
            <button class="menu-btn" onclick="action('settings')">Настройки</button>
        </div>
    </div>

    <!-- Экран игры (пока пустой) -->
    <div id="game-screen">
    <!-- 1. Сцена пробуждения (диалог) -->
    <div id="scene-awake" class="scene">
        <div class="text-box" id="dialogue-box">
            <p id="dialogue-text"></p>
            <button id="next-btn" onclick="nextDialogue()">Далее ▶</button>
        </div>
    </div>

    <!-- 2. Экран "Maksimozo представляет" -->
    <div id="splash-screen" style="display: none;">
        <h1>Maksimozo<br>представляет</h1>
    </div>

    <!-- 3. Комната с окном и турбиной (карта) -->
    <div id="map-container" style="display: none;">
        <div id="ship-window">
            <div id="space-view">
                <div class="debris debris-1"></div>
                <div class="debris debris-2"></div>
                <div id="turbine"></div>
            </div>
        </div>
        <div id="map"></div>
        <div id="player">👨‍🚀</div> 
    </div>

    <!-- Кнопки управления (скрыты, пока не появится карта) -->
    <div id="controls" style="display: none;">
        <button class="control-btn" onclick="move('up')">⬆️</button>
        <div class="control-row">
            <button class="control-btn" onclick="move('left')">⬅️</button>
            <button class="control-btn" onclick="move('down')">⬇️</button>
            <button class="control-btn" onclick="move('right')">➡️</button>
        </div>
    </div>
    </div>

    <!-- Подключаем скрипты -->
    <script src="menu.js"></script>
</body>
</html>
