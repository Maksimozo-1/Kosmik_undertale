<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOSMIK UNDERTALE</title>
    <!-- значок вкладки: пиксельное сердце -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 8' shape-rendering='crispEdges'%3E%3Cpath fill='%23f00' d='M1 0h2v1H1zM6 0h2v1H6zM0 1h4v1H0zM5 1h4v1H5zM0 2h9v2H0zM1 4h7v1H1zM2 5h5v1H2zM3 6h3v1H3zM4 7h1v1H4z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

    <canvas id="space-canvas"></canvas>

    <audio id="bg-music" loop>
        <source src="menu_music.mp3" type="audio/mpeg">
    </audio>
    <!-- Гул корабля на карте -->
    <audio id="ship-ambient" loop preload="auto">
        <source src="ship_ambient.mp3" type="audio/mpeg">
    </audio>

    <!-- Информация о музыке (слева) -->
    <!-- Music by zero-project | www.zero-project.gr — «Gothic», лицензия CC BY 4.0
         (https://creativecommons.org/licenses/by/4.0/). Громкость уменьшена, файл перекодирован. -->
    <div id="music-info">🎵 zero-project — Gothic</div>

    <!-- Кнопка микрофона (справа) -->
    <button id="music-btn" onclick="toggleMusic()">🎤</button>

    <!-- Главное меню -->
    <div class="menu-wrapper" id="main-menu">
        <div class="game-title">KOSMIK<br>UNDERTALE</div>
        <div class="menu-buttons">
            <button class="menu-btn" onclick="action('continue')">Продолжить игру</button>
            <button class="menu-btn" onclick="action('new_game')">Начать новую</button>
            <button class="menu-btn" onclick="action('settings')">Настройки</button>
        </div>
    </div>

    <!-- Экран игры -->
    <div id="game-screen">
        <!-- Диалоги -->
        <div id="scene-awake" class="scene">
            <div class="text-box">
                <p id="dialogue-text">Вы медленно открываете глаза...</p>
                <button id="next-btn">Далее ▶</button>
            </div>
        </div>

        <!-- Титры -->
        <div id="splash-screen" style="display: none;">
            <h1>Maksimozo<br>представляет</h1>
        </div>

        <!-- КАРТА КОРАБЛЯ: всё рисует ship.js -->
        <div id="map-container" style="display: none;">
            <canvas id="ship-canvas"></canvas>
        </div>

        <!-- БОЙ: всё рисует battle.js -->
        <div id="battle-screen" style="display: none;">
            <canvas id="battle-canvas"></canvas>

            <!-- ЭКРАН СМЕРТИ -->
            <div id="death-screen" style="display: none;">
                <div id="death-animation-area">
                    <img id="dead-hero" src="pixelart-9643229_1280.png" alt="ГГ">
                    <img id="killer-symbiote" src="1000098981-removebg-preview.png" alt="Симбиот">
                </div>
                <h1 id="death-title">ВЫ ПОГИБЛИ</h1>

                <div id="death-tip">
                    <p>СОВЕТ: Некоторых врагов невозможно победить в лоб. Возможно, стоит поискать другой путь...</p>
                </div>
                <p id="death-continue">Нажми, чтобы продолжить</p>
            </div>
        </div>

        <!-- Управление -->
        <div id="controls" style="display: none;">
            <div id="joystick-area">
                <div id="joystick-base">
                    <div id="joystick-stick"></div>
                </div>
            </div>
            <div id="action-buttons">
                <button class="action-btn" id="btn-z">Z</button>
                <button class="action-btn" id="btn-x">X</button>
                <button class="action-btn" id="btn-c">C</button>
            </div>
        </div>
    </div>

    <!-- ?v=4 — чтобы телефон не взял старые файлы из памяти. Поменял файлы — увеличь число -->
    <script src="menu.js?v=4"></script>
    <script src="ship.js?v=4"></script>
    <script src="battle.js?v=4"></script>
</body>
</html>
