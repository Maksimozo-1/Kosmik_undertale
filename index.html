<!-- 4. Управление (Джойстик и Кнопки) -->
<div id="controls" style="display: none;">
    <!-- Левая часть: Джойстик -->
    <div id="joystick-area">
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>
    </div>

    <!-- Правая часть: Кнопки действий -->
    <div id="action-buttons">
        <button class="action-btn" id="btn-x">X</button>
        <button class="action-btn" id="btn-y">Y</button>
        <button class="action-btn" id="btn-b">B</button>
        <button class="action-btn" id="btn-c" onclick="nextDialogue()">C</button>
    </div>
</div>
